<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · PowerModeManager</title>
    <script>
      const language = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
      window.location.replace(language.toLowerCase().startsWith("ko") ? "/ko/" : "/en/");
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p><a href="/en/">English</a> · <a href="/ko/">한국어</a></p>
    </main>
  </body>
</html>
